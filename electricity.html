<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#4c1d95">
<title>Electricity Payment - AILAT DATA</title>
<link rel="stylesheet" href="assets/ailat-theme.css?v=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ff;color:#24134d;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:18px 20px;border-radius:0 0 22px 22px}
header a{color:#fff;text-decoration:none;font-size:25px}header h2{margin:12px 0 4px}header p{margin:0;opacity:.9}
main{max-width:480px;margin:auto;padding:18px}.card{background:#fff;border-radius:17px;padding:20px;margin-top:18px;box-shadow:0 4px 15px #0000000d}
h3{margin:0 0 18px;font-size:19px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
input,select{width:100%;height:49px;border:1px solid #ddd6fe;border-radius:10px;padding:0 13px;font-size:15px;background:#fff;color:#24134d;outline:none}
input:focus,select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed18}
button{width:100%;height:49px;border:0;border-radius:10px;background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;font-size:15px;font-weight:700;margin-top:8px}
button:disabled{opacity:.6}.result{display:none;margin-top:16px;padding:14px;border-radius:11px;background:#f3e8ff;line-height:1.7;font-size:14px}
.error{background:#fff1f2;color:#9f1239}.success{background:#ecfdf5;color:#065f46}
.note{font-size:12px;color:#6b6280;line-height:1.6;margin-top:13px}.back{display:block;text-align:center;color:#6d28d9;text-decoration:none;margin:22px}
</style></head>
<body>
<header><a href="dashboard.html">‹</a><h2>AILAT DATA</h2><p>Electricity Bill Payment</p></header>
<main>
<section class="card">
<h3>Verify Electricity Meter</h3>
<div class="field"><label for="disco">Electricity Distribution Company</label>
<select id="disco"><option value="">Select DISCO</option>
<option value="8">Abuja Electricity</option><option value="10">Benin Electricity</option>
<option value="2">Eko Electricity</option><option value="6">Ibadan Electricity</option>
<option value="1">Ikeja Electricity</option><option value="5">Jos (Joss) Electricity</option>
<option value="7">Kaduna Electric</option><option value="3">Kano Electricity</option>
<option value="4">Port Harcourt Electricity</option><option value="9">Yola Electricity</option>
</select></div>
<div class="field"><label for="meterType">Meter Type</label><select id="meterType"><option value="prepaid">Prepaid</option><option value="postpaid">Postpaid</option></select></div>
<div class="field"><label for="meterNumber">Meter Number</label><input id="meterNumber" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="Enter meter number"></div>
<button id="verifyBtn" type="button">Verify Meter</button>
<div id="result" class="result" role="status" aria-live="polite"></div>
<p class="note">Meter verification is performed securely through Legitdataway. No wallet payment or electricity token is issued during verification.</p>
</section>
<a class="back" href="dashboard.html">← Return to Dashboard</a>
</main>
<script>
(function(){
const endpoint="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-order-requests";
const btn=document.getElementById("verifyBtn"),result=document.getElementById("result");
btn.addEventListener("click",async()=>{
 const disco=document.getElementById("disco").value;
 const meterType=document.getElementById("meterType").value;
 const meterNumber=document.getElementById("meterNumber").value.trim();
 result.className="result";result.style.display="block";result.textContent="";
 if(!disco){result.classList.add("error");result.textContent="Please select your electricity company.";return;}
 if(!/^\d{8,13}$/.test(meterNumber)){result.classList.add("error");result.textContent="Enter a valid meter number.";return;}
 btn.disabled=true;btn.textContent="Verifying...";
 try{
  const url=new URL(endpoint);url.searchParams.set("action","electricity_validate");
  url.searchParams.set("disco",disco);url.searchParams.set("meter_type",meterType);url.searchParams.set("meter_number",meterNumber);
  const response=await fetch(url.toString(),{method:"GET",headers:{Accept:"application/json"}});
  const data=await response.json();
  if(!response.ok||!data.success){throw new Error(data.error||"Meter verification failed.");}
  const v=data.validation||{};
  result.classList.add("success");
  result.innerHTML="<strong>Meter verified successfully</strong><br>Customer name: "+escapeHtml(v.name||"Not supplied")+
   "<br>Meter number: "+escapeHtml(v.meter_number||meterNumber)+"<br>Meter type: "+escapeHtml(v.meter_type||meterType.toUpperCase())+
   "<br><small>No payment was taken.</small>";
 }catch(e){result.classList.add("error");result.textContent=e.message||"Unable to verify meter. Please try again.";}
 finally{btn.disabled=false;btn.textContent="Verify Meter";}
});
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
})();
</script>
</body></html>
