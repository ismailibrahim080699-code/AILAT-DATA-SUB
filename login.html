
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AILAT DATA SUB</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#14263f;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 color:#14263f;
 padding:15px;
}

.brand-logo{
 width:100%;max-width:310px;height:auto;display:block;
 margin:0 auto 12px;
 filter:drop-shadow(0 6px 12px #6d28d922);
}

.container{
 width:100%;
 max-width:400px;
 background:white;
 padding:28px 22px;
 border-radius:18px;
 box-shadow:0 4px 15px #00000010;
}

.logo{
 text-align:center;
 color:#b8944e;
 font-size:27px;
 font-weight:bold;
}

.subtitle{
 text-align:center;
 color:#888;
 margin-bottom:25px;
}

label{
 display:block;
 margin:15px 0 7px;
 font-weight:bold;
 font-size:14px;
}

input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:15px;
 outline:none;
}

input:focus{
 border-color:#b8944e;
}

.password-box{
 position:relative;
}

.password-box input{
 padding-right:55px;
}

.toggle-password{
 position:absolute;
 right:10px;
 top:50%;
 transform:translateY(-50%);
 width:38px;
 height:38px;
 border:0;
 background:transparent;
 color:#b8944e;
 font-size:21px;
 cursor:pointer;
 padding:0;
 margin:0;
}

.login-button{
 width:100%;
 padding:15px;
 background:linear-gradient(135deg,#d7bd82,#b8944e);
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 margin-top:22px;
 cursor:pointer;
}

.login-button:disabled{
 opacity:0.6;
}

.resend-button{
 width:100%;
 padding:12px;
 background:#ede9fe;
 color:#5b21b6;
 border:1px solid #ddd6fe;
 border-radius:10px;
 font-size:14px;
 font-weight:bold;
 margin-top:12px;
 cursor:pointer;
 display:none;
}

.links{
 text-align:center;
 margin-top:20px;
 font-size:14px;
}

a{
 color:#6d28d9;
 text-decoration:none;
}

.form-message{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.5}.form-message.show{display:block}.form-message.error{color:#b42318;background:#fff4f2;border:1px solid #fecaca}.form-message.success{color:#176b3a;background:#e9f8ef;border:1px solid #bbf7d0}

.note{
 font-size:12px;
 color:#888;
 text-align:center;
 margin-top:20px;
}
</style>
<link rel="icon" type="image/svg+xml" href="assets/ailat-mark.svg">
<link rel="stylesheet" href="assets/ailat-popups.css?v=1">

<link rel="stylesheet" href="assets/ailat-theme.css?v=4">
<link rel="manifest" href="/manifest.webmanifest?v=1">
<meta name="theme-color" content="#07152f">
</head>

<body>

<div class="container">

<img class="brand-logo" src="assets/ailat-logo.svg" alt="AILAT DATA SUB — Your Trusted Digital Partner">
<p class="subtitle">Welcome Back!</p>

<form id="loginForm">

<label>Email Address</label>
<input
 type="email"
 id="email"
 placeholder="Enter your email"
 autocomplete="email"
 required
>

<label>Password</label>

<div class="password-box">
<input
 type="password"
 id="password"
 placeholder="Enter your password"
 autocomplete="current-password"
 required
>

<button
 type="button"
 class="toggle-password"
 id="togglePassword"
 aria-label="Show password"
 aria-pressed="false"
>👁️</button>
</div>

<p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
<button type="submit" class="login-button" id="loginBtn">
Login
</button>

<button type="button" class="resend-button" id="resendBtn">
Resend Verification Email
</button>

</form>

<div class="links">
Don't have an account?
<a href="register.html">Register Now</a>
</div>

<p class="note">AILAT DATA SUB © 2026</p>

</div>

<script type="module">
import { app } from "./firebase.js";
import { getAuth, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
const auth=getAuth(app);
const form=document.getElementById("loginForm"),button=document.getElementById("loginBtn"),passwordInput=document.getElementById("password"),togglePassword=document.getElementById("togglePassword"),resendBtn=document.getElementById("resendBtn"),formMessage=document.getElementById("formMessage");
function showLoginMessage(message,type="error"){formMessage.textContent=message;formMessage.className="form-message show "+type;}
togglePassword.addEventListener("click",()=>{const show=passwordInput.type==="password";passwordInput.type=show?"text":"password";togglePassword.textContent=show?"🙈":"👁️";togglePassword.setAttribute("aria-label",show?"Hide password":"Show password");togglePassword.setAttribute("aria-pressed",String(show));});
function fromB64url(value){const s=String(value||"").replace(/-/g,"+").replace(/_/g,"/");const raw=atob(s+"=".repeat((4-s.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
function requestOptions(o){return {...o,challenge:fromB64url(o.challenge),allowCredentials:(o.allowCredentials||[]).map(x=>({...x,id:fromB64url(x.id)}))};}
function authenticationJSON(c){const b64=b=>{const a=new Uint8Array(b);let s="";for(const x of a)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");};return {id:c.id,rawId:b64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{clientDataJSON:b64(c.response.clientDataJSON),authenticatorData:b64(c.response.authenticatorData),signature:b64(c.response.signature),userHandle:c.response.userHandle?b64(c.response.userHandle):null}};}
async function passkeyRequest(user,method="GET",body=null){const token=await user.getIdToken(true);const response=await fetch("https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-transaction-passkeys",{method,headers:{"Authorization":"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json().catch(()=>({success:false,error:"Invalid security response"}));if(!response.ok||!data.success)throw new Error(data.error||"Device security check failed.");return data;}
async function verifyRegisteredDevice(user){
 const saved=await passkeyRequest(user);
 if(!saved.passkeys?.length)return false;
 if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials?.get)throw new Error("This browser cannot verify your registered device. Open AILAT DATA SUB in Chrome on your phone.");
 const begin=await passkeyRequest(user,"POST",{action:"start_authentication"});
 const credential=await navigator.credentials.get({publicKey:requestOptions(begin.options)});
 if(!credential)throw new Error("Fingerprint verification was cancelled.");
 const verified=await passkeyRequest(user,"POST",{action:"finish_authentication",response:authenticationJSON(credential)});
 if(!verified.verified)throw new Error("Fingerprint verification was not successful.");
 return true;
}
form.addEventListener("submit",async event=>{
 event.preventDefault();formMessage.className="form-message";formMessage.textContent="";
 const email=document.getElementById("email").value.trim(),password=passwordInput.value;
 button.disabled=true;button.textContent="Checking Account...";resendBtn.style.display="none";
 let signedInUser=null;
 try{
  const result=await signInWithEmailAndPassword(auth,email,password);signedInUser=result.user;
  await signedInUser.reload();
  if(!signedInUser.emailVerified){
   try{await sendEmailVerification(signedInUser);showLoginMessage("Your email is not verified. A verification link has been sent. Check your inbox or spam folder.");resendBtn.style.display="block";}
   finally{await signOut(auth);signedInUser=null;}
   return;
  }
  // Biometric login is temporarily bypassed to restore reliable account access.
  // Transaction PIN and Firebase email/password authentication remain enforced.
  window.location.href="dashboard.html";
 }catch(error){
  console.error("AILAT login/device verification:",error);
  if(signedInUser){try{await signOut(auth);}catch(signOutError){console.error(signOutError);}}
  if(error.name==="NotAllowedError"||error.name==="AbortError")showLoginMessage("Fingerprint was cancelled or timed out. Please try logging in again.");
  else if(error.code==="auth/invalid-credential")showLoginMessage("Incorrect email or password.");
  else if(error.code==="auth/invalid-email")showLoginMessage("Invalid email address.");
  else if(error.code==="auth/too-many-requests")showLoginMessage("Too many attempts. Please try again later.");
  else if(error.code==="auth/network-request-failed")showLoginMessage("Network connection failed. Check your internet and try again.");
  else if(error.code==="auth/user-disabled")showLoginMessage("This account is disabled. Please contact support.");
  else showLoginMessage(error.message||"Login could not be completed. Please try again.");
 }finally{button.disabled=false;button.textContent="Login";}
});
resendBtn.addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(),password=passwordInput.value;
 if(!email||!password){showLoginMessage("Enter your email and password to resend the verification email.");return;}
 resendBtn.disabled=true;resendBtn.textContent="Sending...";
 try{const result=await signInWithEmailAndPassword(auth,email,password);await result.user.reload();if(result.user.emailVerified){await signOut(auth);showLoginMessage("Email already verified. You can now login.","success");resendBtn.style.display="none";}else{await sendEmailVerification(result.user);await signOut(auth);showLoginMessage("Verification email sent successfully. Check your inbox or spam folder.","success");}}
 catch(error){try{if(auth.currentUser)await signOut(auth);}catch(_){}showLoginMessage(error.code==="auth/invalid-credential"?"Incorrect email or password.":"Could not resend verification email. Please try again.");}
 finally{resendBtn.disabled=false;resendBtn.textContent="Resend Verification Email";}
});
</script>

<script src="assets/ailat-popups.js?v=1"></script>
<script src="/assets/ailat-pwa.js?v=1"></script>
</body>
</html>
