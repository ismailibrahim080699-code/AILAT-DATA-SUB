<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Recharge Card Printing | AILAT DATA</title>
<link rel="stylesheet" href="assets/ailat-theme.css?v=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f6;color:#252d34;font-family:Arial,Helvetica,sans-serif}
header{background:#fff;padding:24px 22px 18px;box-shadow:0 4px 18px rgba(20,40,35,.05)}
header a{color:#27333a;text-decoration:none;font-size:29px;line-height:1}
main{max-width:680px;margin:0 auto;padding:14px 16px 30px}
.panel{background:#fff;border-radius:28px;padding:26px 24px 28px;box-shadow:0 9px 22px rgba(25,45,40,.11)}
h1{font-size:clamp(22px,4.7vw,31px);line-height:1.2;margin:4px 0 44px;font-weight:800;letter-spacing:-.5px}
.step-title{font-size:clamp(18px,4vw,24px);font-weight:700;color:#75818a;margin:0 0 24px}
.network-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:54px;max-width:500px}
.network-choice{appearance:none;width:100%;min-height:164px;border:2.5px solid #e5e9e7;border-radius:27px;background:#f3faf6;color:#26333a;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s}
.network-choice[aria-pressed="true"]{border-color:#0aa568;background:#f1faf5;box-shadow:0 0 0 1px rgba(10,165,104,.08)}
.network-choice:focus-visible{outline:3px solid #a5e8c9;outline-offset:3px}
.mtn-mark{width:56px;height:56px;display:block}
.network-name{font-size:23px;font-weight:800;line-height:1}
.step-two{margin-top:0}
.denomination{width:100%;min-height:108px;text-align:left;background:#fff;border:2px solid #e6e8e7;border-radius:28px;padding:22px 22px;color:#242c32;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.denomination.selected{border-color:#0aa568;background:#f8fdf9}
.denomination-main{font-size:23px;font-weight:500}
.denomination-price{display:block;color:#079b5a;font-size:22px;font-weight:800;margin-top:18px}
.denomination-arrow{font-size:25px;color:#079b5a}
.fields{display:grid;gap:24px;margin:72px 0 0}
.field{width:100%;height:96px;border:2px solid #e0e3e2;border-radius:17px;background:#fff;padding:24px;font-size:25px;color:#27333a;outline:none}
.field::placeholder{color:#9ba5ac;opacity:1}
.field:focus{border-color:#0aa568}
.field-label{position:relative}
.field-label span{position:absolute;left:25px;top:-11px;background:#fff;padding:0 7px;color:#9ba5ac;font-size:20px}
.lock-note{margin-top:28px;padding:15px 17px;border-radius:14px;background:#fff8e8;border:1px solid #f2dfb4;color:#75520d;font-size:13px;line-height:1.55}
.lock-note strong{display:block;margin-bottom:4px}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}
.text-button{border:0;background:transparent;color:#079b5a;font-weight:700;font-size:13px;padding:8px 0;cursor:pointer}

[hidden]{display:none!important}
@media(max-width:420px){main{padding:12px 15px 26px}.panel{padding:25px 21px 27px;border-radius:27px}h1{font-size:25px;margin-bottom:48px}.network-grid{grid-template-columns:1fr 1fr;gap:11px;margin-bottom:52px}.network-choice{min-height:154px;border-radius:25px;padding:16px 9px}.fields{margin-top:70px;gap:24px}.field{height:94px;font-size:22px;padding:20px}.denomination{min-height:106px;padding:18px}.denomination-main{font-size:22px}.denomination-price{font-size:22px}}
</style>
</head>
<body>
<header><a href="dashboard.html" aria-label="Back to dashboard">‹</a></header>
<main>
<section class="panel">
<h1>Purchase Recharge Card (E-Pin)</h1>
<h2 class="step-title">1. Select Network</h2>
<div class="network-grid" id="networkGrid">
<button class="network-choice" id="mtnChoice" type="button" aria-pressed="false">
<svg class="mtn-mark" viewBox="0 0 100 100" role="img" aria-label="MTN logo" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="46" fill="#ffcb05"/>
<ellipse cx="50" cy="50" rx="35" ry="25" fill="none" stroke="#111" stroke-width="3.5"/>
<text x="50" y="57" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" letter-spacing="-1.5" fill="#111">MTN</text>
</svg>
<span class="network-name">MTN</span>
</button>
</div>
<section id="denominationSection" hidden>
<h2 class="step-title step-two">2. Select Denomination</h2>
<button class="denomination" id="mtn100" type="button" aria-pressed="false">
<span><span class="denomination-main">100 = ₦100.00</span><span class="denomination-price">₦100.00</span></span>
<span class="denomination-arrow" aria-hidden="true">›</span>
</button>
<div class="fields" id="orderFields" hidden>
<input class="field" type="text" id="cardName" placeholder="Business Name (on card)" autocomplete="organization" maxlength="40">
<label class="field-label"><span>Quantity</span><input class="field" type="number" id="quantity" value="1" min="1" max="100" inputmode="numeric"></label>
<input class="field" type="password" id="transactionPin" placeholder="Transaction Pin" inputmode="numeric" autocomplete="off" maxlength="6">
</div>
</section>
<div class="lock-note" id="purchaseLock"><strong>🔒 Purchases are not enabled yet</strong>The supplier's API plan_type and actual unit cost have not both been confirmed. This screen is for layout preview only; it will not send a supplier request or debit your wallet.</div>
<div class="actions">

<button class="text-button" id="refreshCatalogue" type="button">Refresh catalogue</button>
</div>
<p id="catalogMessage" aria-live="polite" style="font-size:12px;color:#849097;margin:12px 0 0"></p>
</section>
</main>
<script>
const CATALOG_URL="https://bdogulpsybiggpgipdbt.supabase.co/functions/v1/ailat-order-requests?action=recharge_card_plans";
const PUBLISHABLE_KEY="sb_publishable_9wmzpjzVhnby_E3jogTjRw_c22XiDEC";
const mtnChoice=document.getElementById("mtnChoice");
const denominationSection=document.getElementById("denominationSection");
const denomination=document.getElementById("mtn100");
const orderFields=document.getElementById("orderFields");
const message=document.getElementById("catalogMessage");
mtnChoice.addEventListener("click",()=>{
 const selected=mtnChoice.getAttribute("aria-pressed")==="true";
 mtnChoice.setAttribute("aria-pressed",String(!selected));
 denominationSection.hidden=selected;
 if(selected){orderFields.hidden=true;denomination.setAttribute("aria-pressed","false");}
});
denomination.addEventListener("click",()=>{
 const selected=denomination.getAttribute("aria-pressed")==="true";
 denomination.setAttribute("aria-pressed",String(!selected));
 denomination.classList.toggle("selected",!selected);
 orderFields.hidden=selected;
});
document.getElementById("refreshCatalogue").addEventListener("click",async()=>{
 const button=document.getElementById("refreshCatalogue");
 button.disabled=true;button.textContent="Refreshing…";message.textContent="Checking verified catalogue…";
 try{
  const response=await fetch(CATALOG_URL,{headers:{"apikey":PUBLISHABLE_KEY,"Accept":"application/json"},cache:"no-store"});
  const result=await response.json();
  if(!response.ok||!result.success||!Array.isArray(result.plans))throw new Error(result.error||"Catalogue unavailable.");
  const plan=result.plans.find(p=>String(p.network).toUpperCase()==="MTN"&&Number(p.face_value)===100);
  if(!plan)throw new Error("MTN ₦100 is not currently listed in the verified catalogue.");
  document.querySelector(".denomination-main").textContent=Number(plan.face_value)+" = ₦"+Number(plan.face_value).toFixed(2);
  document.querySelector(".denomination-price").textContent="₦"+Number(plan.face_value).toFixed(2);
  message.textContent="Catalogue refreshed successfully.";
 }catch(error){message.textContent=error.message||"Could not refresh catalogue.";}
 finally{button.disabled=false;button.textContent="Refresh catalogue";}
});
</script>
</body>
</html>
